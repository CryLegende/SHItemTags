# SHItemTags - Nametag enchanté (remplace ItemTags)
#
# Le tag garde le marqueur NBT d'ItemTags (ItemTagType = ITEM_NAME_TAG) :
# les tags déjà en possession des joueurs restent utilisables.
# Fonctionnement : clic droit avec le tag -> un menu s'ouvre, le joueur pose l'item au centre (vitre verte :
# renommable, rouge : item interdit) et clique la vitre verte -> un dialogue demande le nom. « Aperçu » montre l'item renommé et dit si le nom sera refusé (mot interdit,
# trop long), « Renommer » applique, « Annuler » (ou Échap) ferme. Un Nametag n'est retiré qu'à la réussite.
# Clients sans dialogues (avant 1.21.6) : après le choix de l'item, le nom s'écrit dans le chat
# (mot d'annulation pour abandonner).
# Les textes sont dans messages.yml.
#
# Commandes (console comprise) :
#   /shitemtags give <joueur> itemnametag [nombre]  Donne des Nametags à un joueur.
#   /shitemtags giveall itemnametag [nombre]        Donne des Nametags à tous les joueurs connectés.
#   /shitemtags reload                              Recharge config.yml et messages.yml. Une erreur de syntaxe
#                                                   annule le rechargement et garde l'ancienne configuration.
#
# Permissions (op par défaut) :
#   shitemtags.admin           Toute l'administration.
#   shitemtags.admin.give      give.
#   shitemtags.admin.giveall   giveall.
#   shitemtags.admin.reload    reload.
#
# Utiliser un Nametag (clic droit) ne demande aucune permission.

# Mot à écrire dans le chat pour abandonner (clients sans dialogues)
mot-annulation: annuler
# Longueur maximale du nom, codes couleur compris (&a compte 2, &#rrggbb compte 14)
longueur-max: 45
mots-interdits:
  - fuck
  - bitch
# Items qui ne peuvent pas être renommés (spawners, têtes...)
items-interdits:
  - NAME_TAG
  - SPAWNER
  - PLAYER_HEAD

dialogues:
  # false : tout le monde écrit le nom dans le chat
  actif: true
  # Version de protocole à partir de laquelle un client reçoit le dialogue (771 = 1.21.6, lu avec ViaVersion)
  min-protocol: 771
# Effet Cécité tant que le dialogue est affiché : le texte se lit sur fond noir. Retiré dès que le joueur
# clique un bouton (ou Échap), sinon dès qu'il tourne la caméra, se déplace ou ouvre un inventaire.
aveugler-pendant-dialogues: true

tag:
  materiau: NAME_TAG
  nom: '&dNametag Enchanté'
  lore:
    - '&7'
    - '&7• &fPermet de renommer un item en'
    - '&futilisant le code couleur.'
    - '&7'
    - '&7• &fCouleurs acceptés :'
    - '&a&&aa &b&&bb &c&&cc &d&&dd &e&&ee'
    - '&f&&ff &1&&11 &2&&22 &3&&33 &4&&44'
    - '&5&&55 &6&&66 &7&&77 &8&&88 &9&&99'
    - '&7'
    - '&7&o((&f&oClic droit &7&opour l''utiliser))'
