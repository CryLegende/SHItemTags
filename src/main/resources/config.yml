# SHItemTags - Nametag enchanté (remplace ItemTags)
#
# Le tag garde le marqueur NBT d'ItemTags (ItemTagType = ITEM_NAME_TAG) :
# les tags déjà en possession des joueurs restent utilisables.
# Fonctionnement : clic droit avec le tag -> le tag est consommé -> le joueur écrit le nom dans le chat
# -> l'item tenu en main à ce moment-là est renommé. Le mot d'annulation (ou une déconnexion) rend le tag.
# Les textes sont dans messages.yml.
#
# Commandes (console comprise) :
#   /shitemtags give <joueur> itemnametag [nombre]  Donne des Nametags à un joueur.
#   /shitemtags giveall itemnametag [nombre]        Donne des Nametags à tous les joueurs connectés.
#   /shitemtags reload                              Recharge config.yml et messages.yml. Une erreur de syntaxe
#                                                   annule le rechargement et garde l'ancienne configuration.
#
# Permissions (op par défaut) :
#   shitemtags.admin           Toute l'administration.
#   shitemtags.admin.give      give.
#   shitemtags.admin.giveall   giveall.
#   shitemtags.admin.reload    reload.
#
# Utiliser un Nametag (clic droit) ne demande aucune permission.

mot-annulation: annuler
longueur-max: 45
mots-interdits:
  - fuck
  - bitch
# Items qui ne peuvent pas être renommés (spawners, têtes...)
items-interdits:
  - NAME_TAG
  - SPAWNER
  - PLAYER_HEAD

tag:
  materiau: NAME_TAG
  nom: '&dNametag Enchanté'
  lore:
    - '&7'
    - '&7• &fPermet de renommer un item en'
    - '&futilisant le code couleur.'
    - '&7'
    - '&7• &fCouleurs acceptés :'
    - '&a&&aa &b&&bb &c&&cc &d&&dd &e&&ee'
    - '&f&&ff &1&&11 &2&&22 &3&&33 &4&&44'
    - '&5&&55 &6&&66 &7&&77 &8&&88 &9&&99'
    - '&7'
    - '&7&o((&f&oClic droit &7&opour l''utiliser))'
