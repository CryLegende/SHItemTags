  - SPAWNER
  - PLAYER_HEAD

dialogues:
  # false : tout le monde écrit le nom dans le chat
  actif: true
  # Version de protocole à partir de laquelle un client reçoit le dialogue (771 = 1.21.6, lu avec ViaVersion)
  min-protocol: 771
# Effet Cécité tant que le dialogue est affiché : le texte se lit sur fond noir. Retiré dès que le joueur
# clique un bouton (ou Échap), sinon dès qu'il tourne la caméra, se déplace ou ouvre un inventaire.
aveugler-pendant-dialogues: true

tag:
  materiau: NAME_TAG
  nom: '&dNametag Enchanté'
  lore:
    - '&7'
    - '&7• &fPermet de renommer un item en'
    - '&futilisant le code couleur.'
    - '&7'
    - '&7• &fCouleurs acceptés :'
    - '&a&&aa &b&&bb &c&&cc &d&&dd &e&&ee'
    - '&f&&ff &1&&11 &2&&22 &3&&33 &4&&44'
    - '&5&&55 &6&&66 &7&&77 &8&&88 &9&&99'
    - '&7'
    - '&7&o((&f&oClic droit &7&opour l''utiliser))'
