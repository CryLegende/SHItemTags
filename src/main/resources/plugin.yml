name: SHItemTags
version: '${project.version}'
main: org.Cry_Legende.sHItemTags.SHItemTags
api-version: '1.21'
author: Cry_Legende
description: Nametags enchantés pour renommer un item en couleur (remplace ItemTags, compatible avec ses tags)
depend: [NBTAPI]

commands:
  shitemtags:
    description: Donne des Nametags enchantés.
    usage: /shitemtags <give|giveall|reload>

permissions:
  shitemtags.admin:
    description: Toute l'administration de SHItemTags.
    default: op
    children:
      shitemtags.admin.give: true
      shitemtags.admin.giveall: true
      shitemtags.admin.reload: true
  shitemtags.admin.give:
    description: Donner des Nametags à un joueur (/shitemtags give).
    default: op
  shitemtags.admin.giveall:
    description: Donner des Nametags à tous les joueurs connectés (/shitemtags giveall).
    default: op
  shitemtags.admin.reload:
    description: Recharger la configuration (/shitemtags reload).
    default: op
